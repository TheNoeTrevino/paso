name: Claude Label PR

on:
  pull_request:
    types: [opened]

jobs:
  label-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Auto-label PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            PR NUMBER: ${{ github.event.pull_request.number }}

            1. Run `gh label list --json name` to get available labels
            2. Run `gh pr diff ${{ github.event.pull_request.number }}` to see the changes
            3. Based on the diff, pick 1-3 labels that best describe this PR
            4. Apply them with `gh pr edit ${{ github.event.pull_request.number }} --add-label "label1,label2"`

            Only use labels that already exist. Do not create new labels.
            Pick the most specific applicable labels. When in doubt, use fewer labels.

          claude_args: '--allowed-tools "Bash(gh label list:*),Bash(gh pr diff:*),Bash(gh pr edit:*)" --model haiku'
