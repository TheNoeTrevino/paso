name: Claude Review

on:
  pull_request:
    types: [opened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request strictly for substantive issues in the following areas:

            - Code quality and best practices
              - Guard pattern flattening
              - Clear DRY violations
              - Refactoring principles aligned with Martin Fowler–style improvements
            - Potential bugs or correctness issues
            - Performance concerns
            - Security risks
            - Missing or insufficient test coverage
            - Violations of established project conventions

            Important rules:

            - Only report real, concrete issues that are directly supported by the code in this PR.
            - Do NOT speculate.
            - Do NOT invent hypothetical issues.
            - Do NOT suggest stylistic preferences unless they clearly violate an established convention.
            - Do NOT praise.

            If no meaningful issues are found:
            - Do NOT create inline comments.
            - Post a single top-level comment stating:
              "No substantive issues found. 10/10."
            - Do not add anything else.

            If issues are found:
            - Use `mcp__github_inline_comment__create_inline_comment` only on specific lines where problems exist.
            - Keep comments concise and factual.
            - At the end, provide a short overall summary and a score out of 10.
            - The score must reflect only real deficiencies found.
            - Do not lower the score unless an actual issue was identified.

          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
