name: SQL Linting with sqruff

on:
  pull_request:
    paths:
      - 'internal/database/sql_postgres/**/*.sql'
      - 'internal/database/sql_sqlite/**/*.sql'
      - '.sqruff'
  push:
    branches:
      - main
    paths:
      - 'internal/database/sql_postgres/**/*.sql'
      - 'internal/database/sql_sqlite/**/*.sql'
      - '.sqruff'

jobs:
  sqruff-lint:
    name: Lint with sqruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarylabs/install-sqruff-cli-action@main
      - name: Lint SQL files
        run: sqruff lint .
