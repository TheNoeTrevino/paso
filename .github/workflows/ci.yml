name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "*.go"
      - "internal/**/*.go"
      - "cmd/**/*.go"
      - "tests/**/*"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".sqlc"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.go"
      - "internal/**/*.go"
      - "cmd/**/*.go"
      - "tests/**/*"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".sqlc"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  security-events: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  SQLC_VERSION: "v1.30.0"

jobs:
  validate-and-build:
    name: Validate and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Cache SQLC
        uses: actions/cache@v4
        id: cache-sqlc
        with:
          path: ~/go/bin/sqlc
          key: sqlc-${{ runner.os }}-${{ env.SQLC_VERSION }}

      - name: Install SQLC
        if: steps.cache-sqlc.outputs.cache-hit != 'true'
        env:
          SQLC_VER: ${{ env.SQLC_VERSION }}
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"$SQLC_VER"

      - name: Check gofmt
        run: |
          echo "Checking Go code formatting..."
          if [ "$(gofmt -s -l . | grep -v '^crush/' | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l . | grep -v '^crush/'
            exit 1
          fi
          echo "All files are properly formatted"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          args: --timeout=5m
          skip-cache: false
          skip-pkg-cache: false
          skip-build-cache: false

      - name: Regenerate adapters
        run: go generate ./internal/database/adapters/...

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code internal/database/adapters/; then
            echo "Generated code is out of date. Run: go generate ./internal/database/adapters/..."
            exit 1
          fi

      - name: Build
        run: |
          echo "Building project..."
          go build -v -o bin/paso .
          echo "Build successful"

      - name: Verify binary
        run: |
          if [ ! -f bin/paso ]; then
            echo "Binary not created"
            exit 1
          fi
          echo "OK: Binary information:"
          file bin/paso
          ls -lh bin/paso

      - name: Smoke test binary
        run: ./bin/paso --version

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests with coverage and race detection
        run: |
          echo "Running tests with coverage..."
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
          echo "Tests passed"
          go tool cover -func=coverage.out > coverage.txt

      - name: Run Benchmarks (smoke test)
        run: go test -bench=. -benchtime=1x -run=^$ ./...

      - name: Check coverage threshold
        run: |
          echo "Checking coverage threshold..."
          COVERAGE=$(tail -1 coverage.txt | grep -oE '[0-9]+\.[0-9]+%' | sed 's/%//')
          if [ -z "$COVERAGE" ]; then
            echo "Failed to parse coverage from coverage.txt"
            exit 1
          fi
          THRESHOLD=30.0
          echo "Current coverage: ${COVERAGE}%"
          echo "Required threshold: ${THRESHOLD}%"

          if awk "BEGIN {exit !($COVERAGE >= $THRESHOLD)}"; then
            echo "Coverage check passed: ${COVERAGE}% >= ${THRESHOLD}%"
          else
            echo "Coverage check failed: ${COVERAGE}% < ${THRESHOLD}%"
            echo "Please add more tests to improve code coverage."
            exit 1
          fi

      - name: Display coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -1 coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage by Package" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'internal/(cli|database|services|daemon|events)' coverage.txt | head -20 >> $GITHUB_STEP_SUMMARY || echo "No detailed coverage available" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt
          retention-days: 30
