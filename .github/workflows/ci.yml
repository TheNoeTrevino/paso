name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      - ".golangci.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  security-events: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.0"
  SQLC_VERSION: "v1.30.0"

jobs:
  sqlc-version:
    name: SQLC Version Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install SQLC
        env:
          SQLC_VER: ${{ env.SQLC_VERSION }}
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@"$SQLC_VER"

      - name: Verify SQLC version
        env:
          EXPECTED_VER: ${{ env.SQLC_VERSION }}
        run: |
          echo "Verifying SQLC version..."
          INSTALLED_VERSION=$(sqlc version)

          echo "Expected version: $EXPECTED_VER"
          echo "Installed version: $INSTALLED_VERSION"

          if [[ "$INSTALLED_VERSION" == *"$EXPECTED_VER"* ]]; then
            echo "✅ SQLC version check passed: $INSTALLED_VERSION"
          else
            echo "❌ SQLC version mismatch detected"
            echo "Expected: $EXPECTED_VER"
            echo "Got: $INSTALLED_VERSION"
            exit 1
          fi

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check gofmt
        run: |
          echo "🧹 Checking Go code formatting..."
          if [ "$(gofmt -s -l . | grep -v '^crush/' | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l . | grep -v '^crush/'
            exit 1
          fi
          echo "✅ All files are properly formatted"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.7.2
          args: --timeout=5m

  generate:
    name: Verify Generated Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Regenerate adapters
        run: go generate ./internal/database/adapters/...

      - name: Check for uncommitted changes
        run: |
          if ! git diff --exit-code internal/database/adapters/; then
            echo "Generated code is out of date. Run: go generate ./internal/database/adapters/..."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [format, lint, sqlc-version, generate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        run: |
          echo "🔨 Building project..."
          go build -v -o bin/paso .
          echo "✅ Build successful"

      - name: Verify binary
        run: |
          if [ ! -f bin/paso ]; then
            echo "❌ Binary not created"
            exit 1
          fi
          echo "📦 Binary information:"
          file bin/paso
          ls -lh bin/paso
