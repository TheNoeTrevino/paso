name: Claude Code Review

on:
  pull_request:
    types: [opened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "internal/**"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request and provide feedback on:
            - Code quality and best practices
              - Guard pattern flattening, hardcore DRY violations
              - Basically, things that would come out of the Refactoring book by Martin Fowler
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage
            - Praise performance improvements for visibility. Note how they do this
            - Following established code conventions

            Use `mcp__github_inline_comment__create_inline_comment` to post inline comments
            on specific lines where issues are found.
            Use `gh pr comment` for a top-level summary only if no inline issues are found.

          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'

