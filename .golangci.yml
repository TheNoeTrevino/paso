version: "2"

linters:
  enable:
    - bodyclose
    - errcheck
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - rowserrcheck
    - staticcheck
    - unused
    - whitespace
  disable:
    - sqlclosecheck      # Disabled: using closeRows helper that properly handles closure
    - tparallel          # Disabled: subtests with shared parent state should NOT use t.Parallel() to avoid race conditions

run:
  timeout: 5m
